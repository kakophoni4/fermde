<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#101114"><title>Fermde</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css?v=2"><script src="/static/app.js?v=2" type="module"></script></head>
<body>
<svg class="svg-library" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4M11 19h2"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
<symbol id="i-apps" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 7a8 8 0 0 1 14 0M19 17a8 8 0 0 1-14 0"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
</defs></svg>
<section id="login" class="login hidden"><div class="login-card"><div class="brand"><span class="brand-mark">f</span> fermde<span class="brand-dot">.</span></div><h1>Вход</h1><form id="login-form"><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти</button></form></div></section>
<div id="workspace" class="hidden"><aside><div class="brand"><span class="brand-mark">f</span> fermde<span class="brand-dot">.</span></div><nav aria-label="Основная навигация"><button data-page="devices" class="selected"><svg><use href="#i-phone"/></svg>Телефоны</button><button data-page="users" class="admin-only"><svg><use href="#i-users"/></svg>Пользователи</button><button data-page="settings" class="admin-only"><svg><use href="#i-settings"/></svg>Настройки</button><button data-page="audit" class="admin-only"><svg><use href="#i-clock"/></svg>Журнал</button></nav><div class="account"><span class="account-label">АККАУНТ</span><strong id="account-name"></strong><button data-action="password" class="subtle">Сменить пароль</button><button data-action="logout" class="subtle">Выйти</button></div></aside><main><header><h1 id="page-title">Телефоны</h1><button id="create" class="primary" data-action="create">＋ Новый телефон</button></header><div id="stats" class="stats admin-only"></div><div id="content" aria-live="polite"></div></main></div>
<dialog id="modal"><form id="modal-form"><div class="dialog-title"><h2 id="modal-title"></h2><button type="button" data-action="close-modal" class="icon" aria-label="Закрыть">×</button></div><div id="modal-fields"></div><p id="modal-error" class="error"></p><footer><button type="button" data-action="close-modal">Отмена</button><button class="primary" id="modal-submit">Сохранить</button></footer></form></dialog>
<dialog id="viewer">
<div class="viewer-head"><div class="viewer-identity"><span class="live-dot"></span><div><strong id="viewer-title">Телефон</strong><span id="stream-status" class="muted">Подключение…</span></div></div><div class="viewer-options"><select id="quality" aria-label="Качество"><option value="fast">Экономный · 30 FPS</option><option value="balanced" selected>Стандарт · 60 FPS</option><option value="sharp">Высокий · 60 FPS</option></select><select id="zoom" aria-label="Масштаб"><option value="fit">По размеру окна</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button data-action="fullscreen" class="icon-button" title="Полный экран" aria-label="Полный экран"><svg><use href="#i-expand"/></svg></button><button data-action="close-viewer" class="icon-button" title="Закрыть просмотр" aria-label="Закрыть просмотр"><svg><use href="#i-close"/></svg></button></div></div>
<div class="viewer-body"><div id="screen-stage" class="screen-stage"><canvas id="screen" tabindex="0" aria-label="Экран Android"></canvas></div><div class="phone-controls"><div class="control-group"><button data-key="4" title="Назад" aria-label="Назад"><svg><use href="#i-back"/></svg></button><button data-key="3" title="Домой" aria-label="Домой"><svg><use href="#i-home"/></svg></button><button data-key="187" title="Приложения" aria-label="Приложения"><svg><use href="#i-apps"/></svg></button></div><div class="control-group"><button data-key="24" title="Громче" aria-label="Громче">＋</button><button data-key="25" title="Тише" aria-label="Тише">−</button><button data-action="reconnect" title="Переподключиться" aria-label="Переподключиться"><svg><use href="#i-refresh"/></svg></button></div><label class="file-button icon-button" title="Загрузить файл или APK" aria-label="Загрузить файл или APK" tabindex="0"><svg><use href="#i-upload"/></svg><input type="file" id="upload" hidden></label></div></div>
<div class="viewer-bottom"><button id="viewer-ip" data-action="viewer-proxy" class="connection-button">Проверить IP</button><div class="clipboard-field"><input id="paste-text" placeholder="Вставить текст…" aria-label="Текст для вставки"><button data-action="paste">Вставить ↵</button></div><button id="audio-toggle" data-action="audio">Звук выкл.</button></div>
</dialog><div id="toast" role="status" class="hidden"></div></body></html>
