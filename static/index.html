<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Fermde — Android</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" type="module"></script></head>
<body>
<section id="login" class="login hidden"><div class="login-card"><div class="brand">▣ <span>fermde</span></div><h1>Ваши телефоны.<br>В одном месте.</h1><p class="muted">Войдите, чтобы открыть своё рабочее пространство.</p><form id="login-form"><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти →</button></form></div></section>
<div id="workspace" class="hidden"><aside><div class="brand">▣ <span>fermde</span></div><span class="nav-label">РАБОЧЕЕ ПРОСТРАНСТВО</span><nav><button data-page="devices" class="selected">▤ Телефоны</button><button data-page="users" class="admin-only">♙ Пользователи</button><button data-page="settings" class="admin-only">⚙ Настройки</button><button data-page="audit" class="admin-only">◷ Журнал</button></nav><div class="account"><strong id="account-name"></strong><button data-action="password" class="subtle">Сменить пароль</button><button data-action="logout" class="subtle">Выйти</button></div></aside>
<main><header><div><p class="eyebrow">FERMDE / ANDROID WORKSPACE</p><h1 id="page-title">Телефоны</h1></div><button id="create" class="primary" data-action="create">＋ Создать телефон</button></header><div id="stats" class="stats admin-only"></div><div id="content" aria-live="polite"></div></main></div>
<dialog id="modal"><form id="modal-form"><div class="dialog-title"><h2 id="modal-title"></h2><button type="button" data-action="close-modal" class="icon" aria-label="Закрыть">×</button></div><div id="modal-fields"></div><p id="modal-error" class="error"></p><footer><button type="button" data-action="close-modal">Отмена</button><button class="primary" id="modal-submit">Сохранить</button></footer></form></dialog>
<dialog id="viewer"><div class="viewer-head"><div><strong id="viewer-title">Телефон</strong><span id="stream-status" class="muted">Подключаем экран…</span></div><button data-action="close-viewer">Закрыть просмотр ×</button></div><div class="viewer-options"><select id="quality" aria-label="Качество"><option value="fast">Быстрее · 1024 / 30 FPS</option><option value="balanced" selected>Баланс · 1600 / 60 FPS</option><option value="sharp">Чётче · 2400 / 60 FPS</option></select><button id="audio-toggle" data-action="audio">Включить звук</button></div><div class="viewer-body"><canvas id="screen" tabindex="0" aria-label="Экран Android, управление мышью и клавиатурой"></canvas><div class="phone-controls"><button data-key="4" title="Назад">◁</button><button data-key="3" title="Домой">○</button><button data-key="187" title="Приложения">□</button><hr><button data-key="24" title="Громче">＋</button><button data-key="25" title="Тише">−</button><button data-action="reconnect">↻</button></div></div><div class="viewer-bottom"><input id="paste-text" placeholder="Текст для вставки в телефон" aria-label="Текст для вставки"><button data-action="paste">Вставить</button><label class="file-button">Файл / APK<input type="file" id="upload" hidden></label></div><p class="viewer-note">Закрытие просмотра не выключает телефон. Отдельные приложения могут запрещать захват изображения или звука.</p></dialog>
<div id="toast" role="status" class="hidden"></div></body></html>
